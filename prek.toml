# prek の設定ファイル
# prek は Rust で実装された Git フックフレームワーク
# 詳細は https://prek.j178.dev を参照
#:schema https://www.schemastore.org/prek.json

# ビルド成果物を対象外にする
exclude = { glob = ["target/**"] }

# 組み込みフック
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-toml" },
  { id = "check-yaml" },
]

# ローカルフック
[[repos]]
repo = "local"
hooks = [
  {
    id = "cargo-fmt",
    name = "cargo fmt",
    entry = "cargo fmt --all -- --check",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    priority = 0,
  },
  {
    id = "cargo-clippy",
    name = "cargo clippy",
    entry = "cargo clippy --workspace --all-targets -- -D warnings",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    priority = 10,
  },
]
