# prek の設定ファイル
# prek は Rust で実装された Git フックフレームワーク
# 詳細は https://prek.j178.dev を参照
#:schema https://www.schemastore.org/prek.json

# ビルド成果物を対象外にする
exclude = { glob = ["target/**"] }

# 組み込みフック
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-toml" },
  { id = "check-yaml" },
]

# ローカルフック
[[repos]]
repo = "local"
hooks = [
  {
    id = "tombi-fmt",
    name = "tombi fmt",
    entry = "tombi format --check",
    language = "system",
    types = ["toml"],
    # Cargo.lock は cargo が独自に再生成するため対象外
    exclude = { glob = ["Cargo.lock"] },
    pass_filenames = false,
    priority = 0,
  },
  {
    id = "tombi-lint",
    name = "tombi lint",
    entry = "tombi lint",
    language = "system",
    types = ["toml"],
    # Cargo.lock は cargo が独自に再生成するため対象外
    exclude = { glob = ["Cargo.lock"] },
    pass_filenames = false,
    priority = 5,
  },
  {
    id = "cargo-fmt",
    name = "cargo fmt",
    entry = "cargo fmt --all -- --check",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    priority = 10,
  },
  {
    id = "cargo-clippy",
    name = "cargo clippy",
    entry = "cargo clippy --workspace --all-targets -- -D warnings",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    priority = 20,
  },
]
